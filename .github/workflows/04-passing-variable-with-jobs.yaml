name: Passing Variables Between Jobs
on:
  workflow_dispatch:
  
jobs:
  producer:
    runs-on: ubuntu-latest
    
    outputs:
      foo: ${{ steps.generate-foo.outputs.foo }}
    steps:
      - name: Generate variable and export it
        id: generate-foo
        run: |
          foo="bar"
          
          # 1) Step output (for job outputs)
          echo "foo=${foo}" >> "$GITHUB_OUTPUT"
          
          # 2) Environment variable 
          echo "FOO=${foo}" >> "$GITHUB_ENV"
          
      - name: Inspect values inside producer job
        run: |
          echo "FOO (set via GITHUB_ENV): $FOO"
          echo "foo (set output): ${{ steps.generate-foo.outputs.foo }}"
         
  consumer:
    runs-on: ubuntu-latest
    needs: producer
    steps:
      - name: Inspect values inside consumer (note FOO is unset)
        run: |
          echo "Values from producer: ${{ needs.producer.outputs.foo }}"
          echo "FOO in consumer: ${FOO:-<UNSET>}"