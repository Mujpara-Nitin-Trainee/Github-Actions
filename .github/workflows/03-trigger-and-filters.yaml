name: Triggers and Filters

on:
  push:
    branches:
      - "example-branch/*"
  
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "filters/*.md"
      - "filters/*.txt"
  
  schedule:
    - cron: "0 0 * * *" # Runs daily at midnight UTC
  
  workflow_dispatch:

jobs:
  echo-event:
    runs-on: ubuntu-latest
    steps:
      - name: Dump full event JSON
        run: |
          echo "=== $GITHUB_EVENT_NAME payload ==="
          cat "$GITHUB_EVENT_PATH"